apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: nginx
spec:
  controller: k8s.io/ingress-nginx

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: product-aura-api-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: "api.auradental.vn"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: product-aura-api-service
            port:
              number: 80
 


