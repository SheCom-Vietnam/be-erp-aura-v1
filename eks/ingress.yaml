apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: nginx
spec:
  controller: k8s.io/ingress-nginx

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: product-aura-api-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  rules:
  - host: "new-api.auradental.vn"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: product-aura-api-service
            port:
              number: 80

  tls:
  - hosts:
    - new-api.auradental.vn
    secretName: product-aura-api-cert
  


